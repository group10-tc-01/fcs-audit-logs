name: fcs.Audit.Logs CI

on:
  pull_request:
    branches: [main, develop]
    paths:
      - src/**
      - tests/**
      - Directory.Build.props
      - Directory.Packages.props
      - .editorconfig
      - docker-compose.yml
      - .github/workflows/dotnet-service-ci.yml
  push:
    branches: [main, develop]
    paths:
      - src/**
      - tests/**
      - Directory.Build.props
      - Directory.Packages.props
      - .editorconfig
      - docker-compose.yml
      - .github/workflows/dotnet-service-ci.yml
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  checks: write
  security-events: write

jobs:
  ci:
    uses: group10-tc-01/fcs-pipelines/.github/workflows/dotnet-service-ci.yml@main
    with:
      service_name: fcs-audit-logs
      dotnet_version: 8.0.x
      solution_path: fcs.Audit.Logs.slnx
      unit_tests_path: tests/fcs.Audit.Logs.Application.Tests/fcs.Audit.Logs.Application.Tests.csproj
      test_environment: Test
      coverage_threshold: 80
      run_sonar: false
    secrets: inherit
